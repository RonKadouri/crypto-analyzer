<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f2c14e"/>
            <stop offset="1" stop-color="#d99a0b"/>
        </linearGradient>
    </defs>

    <!-- Navy tile background -->
    <rect width="64" height="64" rx="14" fill="#1e293b"/>

    <!-- Gold coin with inner ring -->
    <circle cx="32" cy="32" r="25" fill="url(#coin)"/>
    <circle cx="32" cy="32" r="20.5" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-opacity="0.35"/>

    <!-- Bitcoin mark, drawn as paths so no font is needed -->
    <g stroke="#1e293b" stroke-width="4" stroke-linecap="round" fill="none">
        <!-- B stem and the two bowls -->
        <path d="M26 20v24"/>
        <path d="M24 20h9.5a6 6 0 0 1 0 12H24"/>
        <path d="M24 32h10.5a6 6 0 0 1 0 12H24"/>
        <!-- Protruding bars, top and bottom -->
        <path d="M29 15.5V20M35 15.5V20M29 44v4.5M35 44v4.5"/>
    </g>
</svg>
